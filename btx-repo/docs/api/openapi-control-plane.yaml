openapi: 3.1.0
info:
  title: BTX Control Plane API
  version: 0.1.0
servers:
  - url: https://control-plane.btx.local
paths:
  /healthz:
    get:
      operationId: healthz
      responses:
        '200':
          description: service health
          content:
            application/json:
              schema:
                type: object
                required: [ok, service]
                properties:
                  ok: { type: boolean }
                  service: { type: string }
  /v1/consents/{consentId}/revoke:
    post:
      operationId: revokeConsent
      parameters:
        - in: path
          name: consentId
          required: true
          schema: { type: string }
      requestBody:
        required: false
      responses:
        '200':
          description: revoke accepted
          content:
            application/json:
              schema:
                type: object
                required: [decision, consentId]
                properties:
                  decision: { type: string, enum: [revoked] }
                  consentId: { type: string }
components:
  securitySchemes:
    mtls:
      type: mutualTLS
security:
  - mtls: []
